spring.application.name=smartlearn
server.port=8082

# MYSQL / XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/smartlearn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SESSION
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Public PDF flashcards. Keep AI credentials on the server.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
smartlearn.ai.api-key=${OPENAI_API_KEY:}
smartlearn.ai.key-file=${OPENAI_API_KEY_FILE:C:/Users/benkh/Downloads/SmartLearn/.local/openai-api-key.txt}
smartlearn.ai.model=${OPENAI_MODEL:gpt-4o-mini}
smartlearn.ai.responses-url=https://api.openai.com/v1/responses
smartlearn.ai.rate-limit-enabled=${AI_RATE_LIMIT_ENABLED:true}

# AI Tutor — compatible Groq (gratuit), OpenAI, OpenRouter
# Mettez votre cle Groq dans .local/openai-api-key.txt
# Obtenez une cle gratuite sur https://console.groq.com
smartlearn.tutor.ai.model=${TUTOR_AI_MODEL:qwen/qwen3.8-27b}
smartlearn.tutor.ai.url=${TUTOR_AI_URL:https://api.groq.com/openai/v1/chat/completions}
smartlearn.video.ffmpeg=${VIDEO_FFMPEG:}
smartlearn.video.work-dir=${VIDEO_WORK_DIR:.local/video-work}
smartlearn.speech.key=${AZURE_SPEECH_KEY:}
smartlearn.speech.region=${AZURE_SPEECH_REGION:}
smartlearn.speech.settings-file=${AZURE_SPEECH_SETTINGS_FILE:.local/azure-speech.json}
smartlearn.speech.voice-fr=${AZURE_SPEECH_VOICE_FR:fr-FR-VivienneMultilingualNeural}
smartlearn.speech.voice-en=${AZURE_SPEECH_VOICE_EN:en-US-JennyNeural}
smartlearn.speech.voice-ar=${AZURE_SPEECH_VOICE_AR:ar-SA-ZariyahNeural}
