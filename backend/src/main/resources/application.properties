spring.application.name=smartlearn
server.port=8081

# MYSQL / XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/smartlearn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SESSION
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
smartlearn.admin.email=admin@smartlearn.local
smartlearn.admin.password=admin123