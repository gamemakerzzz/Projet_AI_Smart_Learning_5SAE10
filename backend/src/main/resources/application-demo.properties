# Full-platform demo profile. The main launcher supplies an absolute persistent H2 URL.
# Direct Maven starts use a database relative to the process working directory.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./.local/smartlearn-demo-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
smartlearn.admin.password=DemoAdmin2026!
smartlearn.ai.key-file=${OPENAI_API_KEY_FILE:C:/Users/benkh/Downloads/SmartLearn/.local/openai-api-key.txt}
