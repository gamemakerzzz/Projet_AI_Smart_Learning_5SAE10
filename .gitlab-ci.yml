stages:
  - build
  - test

backend-build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn -B clean package -DskipTests

frontend-build:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm ci
    - npm run build

backend-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn -B test

mla-check:
  stage: test
  image: python:3.12-slim
  script:
    - cd mla-service
    - pip install --no-cache-dir -r requirements.txt
    - python -m py_compile main.py